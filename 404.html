<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found 找不到頁面 | 升威 LE-RELAX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#EEEFEC; --panel:#F8F8F6; --ink:#1C1F22;
  --steel:#7B8288; --hairline:#C7CBC6; --copper:#B5622E; --leaf:#5B7A4A;
  --copper-text:#96501F; /* darker copper for text on light backgrounds — meets WCAG AA 4.5:1 (the base --copper is ~4.16:1, which fails) */
  --copper-light:#D6884F; /* lighter copper for text on dark backgrounds — meets WCAG AA */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);}
body{
  font-family:'Inter',sans-serif;color:var(--ink);
  background-image:radial-gradient(circle, rgba(28,31,34,0.07) 1px, transparent 1px);
  background-size:22px 22px;
}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px;}
a{color:inherit;}
.topbar{
  display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:28px;flex-wrap:wrap;gap:10px;
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-bottom{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:10px;}
.topbar-nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.topbar-lang{display:flex;align-items:center;padding-left:14px;border-left:1px solid var(--hairline);}
@media (max-width:760px){
  .topbar-lang{padding-left:8px;}
}
.logo-mark{height:40px;width:auto;display:block;}
.brand{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--steel);}
h1.pagetitle{font-family:'Archivo',sans-serif;font-weight:800;font-size:28px;letter-spacing:-0.01em;line-height:1.15;margin:0;}
.navlink{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);border:1px solid var(--hairline);padding:6px 10px;text-decoration:none;}
.navlink:hover{border-color:var(--ink);color:var(--ink);}
.navlink.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600;}
.navlink.primary:hover{background:var(--copper);border-color:var(--copper);color:#fff;}
.mainnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.crumbs{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);margin-bottom:16px;}
.crumbs a{text-decoration:none;color:var(--steel);}
.crumbs a:hover{color:var(--ink);}
.lead{font-size:16px;line-height:1.65;margin:0 0 8px;}
.lead-zh{font-size:16px;line-height:1.75;color:var(--steel);margin:0 0 28px;}
.section-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--steel);margin:36px 0 14px;border-bottom:1px solid var(--hairline);padding-bottom:8px;}
.modelgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.modelcard{background:var(--panel);border:1px solid var(--hairline);text-decoration:none;color:var(--ink);display:block;transition:border-color .15s;}
.modelcard:hover{border-color:var(--ink);}
.modelcard .thumbwrap{background:var(--paper);border-bottom:1px solid var(--hairline);height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.modelcard .thumbwrap img{width:100%;height:100%;object-fit:contain;filter:saturate(0.92);}
.modelcard .body{padding:12px 14px 14px;}
.modelcard .mid{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;}
.modelcard .mname{font-family:'Archivo',sans-serif;font-weight:600;font-size:15px;line-height:1.4;margin-top:2px;}
.modelcard .mname .zh{display:block;font-size:19px;margin-top:2px;}
.modelcard .mprice{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--copper-text);margin-top:8px;}
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:30px;margin-bottom:8px;}
@media (max-width:720px){ .hero{grid-template-columns:1fr;} }
.hero-photo{background:var(--panel);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;min-height:280px;overflow:hidden;padding:12px;}
.hero-photo img{width:100%;height:100%;object-fit:contain;}
.hero-photo .noimg{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);padding:30px;text-align:center;}
.specs{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:6px;}
.specs td{padding:9px 0;border-bottom:1px dashed var(--hairline);}
.specs td:first-child{color:var(--steel);width:42%;}
.price-callout{background:var(--panel);border:1px solid var(--hairline);padding:18px 20px;margin-top:18px;}
.info-box{background:var(--panel);border:1px solid var(--hairline);padding:18px 20px;margin-bottom:24px;font-size:14px;line-height:1.7;}
.tier-links{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
@media (max-width:600px){ .tier-links{grid-template-columns:1fr;} }
.tier-link-card{display:block;background:var(--panel);border:1px solid var(--hairline);padding:16px 18px;text-decoration:none;color:var(--ink);transition:border-color .15s;}
.tier-link-card:hover{border-color:var(--copper);}
.tier-link-card b{display:block;font-family:'Archivo',sans-serif;font-weight:700;font-size:15px;color:var(--copper-text);margin-bottom:4px;}
.tier-link-card span{display:block;font-size:13px;color:var(--steel);line-height:1.5;}
.firsttime-banner{display:block;background:var(--ink);color:var(--paper);padding:14px 18px;margin:18px 0;text-decoration:none;font-family:'Archivo',sans-serif;font-size:14px;transition:background .15s;}
.firsttime-banner:hover{background:var(--copper);}
.firsttime-banner b{font-weight:700;}
.info-box b{font-family:'Archivo',sans-serif;font-size:14.5px;}
.info-box a{color:var(--copper-text);text-decoration:underline;}
.price-callout .amt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:26px;color:var(--copper);}
.price-callout .note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);margin-top:6px;line-height:1.6;}
.cta-btn{
  display:inline-block;margin-top:16px;background:var(--copper-text);color:#fff;
  font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;text-decoration:none;
  padding:13px 22px;letter-spacing:0.01em;
}
.cta-btn:hover{background:var(--copper);}
.store-list{margin-top:14px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.store{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--steel);line-height:1.7;background:var(--panel);border:1px solid var(--hairline);padding:14px 16px;}
.store .store-name{color:var(--ink);font-weight:600;display:block;margin-bottom:4px;}
.store .store-contact{color:var(--copper-text);}
footer.sitefoot{margin-top:50px;padding-top:20px;border-top:2px solid var(--ink);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);}

/* full-width contact CTA banner */
body{overflow-x:hidden;}
.contact-banner{
  background:var(--ink); color:var(--paper);
  padding:28px 20px 32px; margin-top:50px; border:1px solid var(--ink);
}
.contact-banner-inner{max-width:1000px;margin:0 auto;}
.contact-banner h2{font-family:'Archivo',sans-serif;font-weight:800;font-size:25px;margin:0 0 6px;color:#fff;letter-spacing:-0.01em;}
.contact-banner h2 .accent{color:var(--copper-light);}
.ticker-wrap{overflow:hidden;white-space:nowrap;width:100%;margin-bottom:20px;border-top:1px solid rgba(255,255,255,0.15);border-bottom:1px solid rgba(255,255,255,0.15);padding:12px 0;}
.ticker-track{display:inline-flex;animation:ticker 72s linear infinite;}
.ticker-seg{padding-right:56px;font-family:'Archivo',sans-serif;font-weight:500;font-size:21px;color:#fff;letter-spacing:-0.01em;white-space:nowrap;flex-shrink:0;}
.ticker-seg .accent{color:var(--copper-light);}
@keyframes ticker{ 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }
.contact-banner .sub{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#B7BCB7;margin-bottom:24px;line-height:1.7;}
.contact-banner .sub .zh{display:block;margin-top:4px;}
.contact-stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;}
.contact-store{background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.15);padding:16px 18px;}
.contact-store .cs-name{font-family:'Archivo',sans-serif;font-weight:500;font-size:12.5px;color:#fff;margin-bottom:2px;}
.contact-store .cs-addr{font-family:'Archivo',sans-serif;font-weight:500;font-size:12.5px;color:#fff;line-height:1.5;margin-bottom:13px;}
.cs-buttons{display:flex;gap:8px;flex-wrap:wrap;}
.cs-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;padding:13px 16px;text-decoration:none;white-space:nowrap;min-height:44px;}
.cs-btn svg{width:14px;height:14px;flex-shrink:0;}
.cs-btn.call{background:var(--copper-text);color:#fff;}
.cs-btn.call:hover{background:#c9713a;}
.cs-btn.wa{background:#25D366;color:#07321B;}
.cs-btn.wa:hover{background:#1fbd5c;}

/* FAQ section */
.faq-item{border-bottom:1px solid var(--hairline);padding:16px 0;}
.faq-q{font-family:'Archivo',sans-serif;font-weight:700;font-size:14.5px;margin-bottom:4px;}
.faq-q-zh{font-family:'Archivo',sans-serif;font-weight:700;font-size:17px;color:var(--steel);margin-bottom:10px;}
.faq-a{font-size:14px;line-height:1.65;margin-bottom:6px;}
.faq-a-zh{font-size:16px;line-height:1.8;color:var(--steel);}

/* Blog */
.blog-list{display:grid;gap:16px;}
.blog-card{background:var(--panel);border:1px solid var(--hairline);padding:20px 22px;text-decoration:none;color:var(--ink);display:block;transition:border-color .15s;}
.blog-card:hover{border-color:var(--ink);}
.blog-card .bc-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:17px;margin-bottom:4px;}
.blog-card .bc-title-zh{font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;color:var(--steel);margin-bottom:8px;}
.blog-card .bc-excerpt{font-size:13.5px;line-height:1.6;color:var(--steel);}
.blog-card .bc-date{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--steel);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.article-body{font-size:16px;line-height:1.75;max-width:720px;}
.article-body h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:20px;margin:32px 0 4px;}
.blog-img-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin:14px 0 18px;}
.blog-img-row figure{margin:0;text-align:center;}
.blog-img-row img{display:block;width:auto;height:170px;max-width:100%;object-fit:contain;border:1px solid var(--hairline);background:#fff;}
.blog-img-row figcaption{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);margin-top:6px;max-width:140px;}
.blog-img-row.wide{display:block;}
.blog-img-row.wide figure{width:100%;}
.blog-img-row.wide img{width:100%;height:auto;max-width:100%;}
.blog-img-row.wide figcaption{max-width:none;}
@media (max-width:600px){ .blog-img-row img{height:130px;} .blog-img-row.wide img{max-height:160px;} }
.article-body h2.zh{font-size:21px;color:var(--steel);margin:2px 0 14px;font-weight:600;}
.article-body p{margin:0 0 14px;}
.article-body p.zh{color:var(--steel);font-size:17px;line-height:1.85;}
.article-body ul{margin:0 0 14px;padding-left:22px;}
.article-body li{margin-bottom:6px;}

/* stores page */
.store-full-list{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media (max-width:820px){ .store-full-list{grid-template-columns:1fr;} }
.store-full-card{background:var(--panel);border:1px solid var(--hairline);display:flex;flex-direction:column;height:100%;}
.store-full-actions{margin-top:auto;padding-top:14px;}
.store-full-photo{width:100%;height:190px;object-fit:contain;background:var(--paper);display:block;border-bottom:1px solid var(--hairline);}
.store-full-body{padding:16px 18px;display:flex;flex-direction:column;flex:1;}
.store-full-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:18px;margin-bottom:2px;}
.store-full-name-zh{font-family:'Archivo',sans-serif;font-weight:700;font-size:19px;color:var(--steel);margin-bottom:14px;}
.store-full-addr{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);line-height:1.7;margin-bottom:2px;}
.store-full-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);line-height:1.6;margin-top:8px;}
.store-full-meta b{color:var(--ink);font-weight:600;}
.store-full-addr-zh{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);line-height:1.7;margin-bottom:14px;}
.store-full-map{width:100%;height:200px;border:1px solid var(--hairline);margin-top:14px;}
.article-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;}

/* Chinese text runs visually smaller than Latin text at the same font-size, so bump key
   reading text up on Chinese pages for comparable legibility. */
html[lang="zh-Hant"] .lead{font-size:18px;}
html[lang="zh-Hant"] .modelcard .mname{font-size:18px;}
html[lang="zh-Hant"] .price-callout .note{font-size:13px;}
html[lang="zh-Hant"] .firsttime-banner{font-size:16px;}

.notfound-wrap{max-width:560px;margin:80px auto;padding:0 20px;text-align:center;}
.notfound-code{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--steel);letter-spacing:0.1em;margin-bottom:18px;}
.notfound-title{font-family:'Archivo',sans-serif;font-weight:800;font-size:26px;margin:0 0 10px;}
.notfound-sub{font-size:15px;color:var(--steel);margin-bottom:32px;line-height:1.6;}
.notfound-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
</style>

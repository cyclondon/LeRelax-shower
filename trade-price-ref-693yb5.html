<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Internal Access 內部登入 — 升威 LE-RELAX</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon.png">
<style>
  :root{
    --paper:#EEEFEC; --panel:#F8F8F6; --ink:#1C1F22;
    --steel:#7B8288; --hairline:#C7CBC6; --copper:#B5622E;
    --copper-text:#96501F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    background:var(--panel);border:1px solid var(--hairline);
    max-width:380px;width:100%;padding:30px 28px;
  }
  .logo-mark{height:36px;width:auto;display:block;margin:0 auto 18px;}
  h1{font-size:17px;font-weight:700;text-align:center;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{font-size:12.5px;color:var(--steel);text-align:center;margin:0 0 22px;line-height:1.5;}
  label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin-bottom:6px;}
  input[type=password]{
    width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--hairline);
    background:#fff;color:var(--ink);margin-bottom:14px;
  }
  input[type=password]:focus{outline:none;border-color:var(--ink);}
  button{
    width:100%;font-size:14px;font-weight:700;padding:11px;border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);cursor:pointer;
  }
  button:hover{background:var(--copper-text);border-color:var(--copper-text);}
  .err{
    display:none;font-size:12.5px;color:#B5322E;margin-bottom:12px;
    background:#FBEAEA;border:1px solid #E6B6B6;padding:8px 10px;
  }
  .err.show{display:block;}
  .back{display:block;text-align:center;margin-top:18px;font-size:12px;color:var(--steel);text-decoration:none;}
  .back:hover{color:var(--ink);}
</style>
</head>
<body>
<div class="card">
  <img class="logo-mark" src="assets/logo.png" alt="升威 LE-RELAX logo">
  <h1>Internal Access Only</h1>
  <p class="sub">Trade pricing reference for LE-RELAX staff and authorised distributors.<br>只供內部員工及授權經銷商使用。</p>
  <div class="err" id="err">Incorrect password. Please try again. 密碼錯誤，請重試。</div>
  <form id="gateForm" autocomplete="off">
    <label for="pw">Password 密碼</label>
    <input type="password" id="pw" name="pw" autocomplete="current-password" required>
    <button type="submit">Unlock 解鎖</button>
  </form>
  <a class="back" href="index.html">&larr; Back to site 返回網站</a>
</div>
<script>
  // SHA-256 hash of the internal access password. The plaintext password is
  // never stored in this file — only its hash, which is compared against a
  // hash computed from whatever the visitor types in.
  const PW_HASH = "07eeac73654b3ac8845b35322d1cd8312351681c63885c261b3796549d8af80b";

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  document.getElementById("gateForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    const hash = await sha256(pw);
    if (hash === PW_HASH) {
      sessionStorage.setItem("lerelaxInternal", "1");
      location.href = "configurator.html#/models";
    } else {
      document.getElementById("err").classList.add("show");
    }
  });
</script>
</body>
</html>

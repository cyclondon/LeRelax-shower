<style>

  *{box-sizing:border-box;}

  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  select#districtSelect{
    font-size:14px; padding:7px 10px; border:1px solid var(--hairline); border-radius:4px;
    background:#fff; color:var(--ink); min-width:220px; cursor:pointer;
  }
  .stat-pill{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:20px;
    padding:6px 14px; font-size:12.5px; color:#fff; font-weight:600;
  }
  .stat-pill b{color:var(--copper-light); font-size:14px;}
  main{flex:1; display:flex; min-height:0;}
  #map{flex:1; height:100%;}
  #sidebar{
    width:300px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--hairline);
    display:flex; flex-direction:column; height:100%;
  }
  #sidebar .sb-head{
    padding:14px 16px 10px; border-bottom:1px solid var(--hairline);
  }
  #sidebar .sb-head h2{font-size:14px; margin:0 0 3px; font-weight:700;}
  #sidebar .sb-head .sb-sub{font-size:11.5px; color:var(--steel); line-height:1.5;}
  #distList{flex:1; overflow-y:auto; padding:6px 0; margin:0; list-style:none;}
  #distList li{
    padding:9px 16px; font-size:13px; border-bottom:1px solid rgba(199,203,198,0.5);
    line-height:1.4;
  }
  #distList li:hover{background:rgba(181,98,46,0.06);}
  #distList .empty-msg{padding:20px 16px; font-size:12.5px; color:var(--steel); line-height:1.6;}
  @media (max-width:720px){
    main{flex-direction:column;}
    #sidebar{width:100%; height:38%; border-left:none; border-top:1px solid var(--hairline);}
    #map{height:62%;}
    header h1 .zh{display:block; margin-left:0;}
  }
</style>
</head>

let map, markers = [], infoWindow;

function initMap(){
  map = new google.maps.Map(document.getElementById("map"), {
    center: {lat:22.3800, lng:114.1200},
    zoom: 11,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: true,
    styles: [
      {featureType:"poi", elementType:"labels", stylers:[{visibility:"off"}]}
    ]
  });
  infoWindow = new google.maps.InfoWindow();

  document.getElementById("totalCount").textContent = DATA.length;

  // build markers
  DATA.forEach(function(d){
    const marker = new google.maps.Marker({
      position: {lat:d.lat, lng:d.lng},
      map: map,
      title: d.n,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 5,
        fillColor: "#B5622E",
        fillOpacity: 0.85,
        strokeColor: "#ffffff",
        strokeWeight: 1
      }
    });
    marker.addListener("click", function(){
      infoWindow.setContent('<div style="font-family:-apple-system,sans-serif;font-size:13px;font-weight:600;padding:2px 4px;">' + escapeHtml(d.n) + '</div>');
      infoWindow.open(map, marker);
    });
    marker._district = d.d;
    markers.push(marker);
  });

  fitAllMarkers();
  populateDropdown();
  showDistrict("__ALL__");

  document.getElementById("districtSelect").addEventListener("change", function(e){
    showDistrict(e.target.value);
  });
}

function fitAllMarkers(){
  const bounds = new google.maps.LatLngBounds();
  markers.forEach(function(m){ bounds.extend(m.getPosition()); });
  map.fitBounds(bounds);
}

function populateDropdown(){
  const sel = document.getElementById("districtSelect");
  const counts = {};
  DATA.forEach(function(d){ counts[d.d] = (counts[d.d]||0) + 1; });

  const optAll = document.createElement("option");
  optAll.value = "__ALL__";
  optAll.textContent = "All Districts 全部地區 (" + DATA.length + ")";
  sel.appendChild(optAll);

  Object.keys(DISTRICTS).forEach(function(key){
    const opt = document.createElement("option");
    opt.value = key;
    const n = counts[key] || 0;
    opt.textContent = key + " " + DISTRICTS[key].en + " (" + n + ")";
    sel.appendChild(opt);
  });
}

function showDistrict(key){
  const listEl = document.getElementById("distList");
  const titleEl = document.getElementById("sbTitle");
  const subEl = document.getElementById("sbSub");
  listEl.innerHTML = "";

  if(key === "__ALL__"){
    markers.forEach(function(m){ m.setMap(map); });
    fitAllMarkers();
    titleEl.textContent = "All Districts 全部地區";
    subEl.textContent = "Select a district from the dropdown above to see the distributors in that area. 請於上方選單選擇地區，查看該區經銷商名單。";
    const msg = document.createElement("li");
    msg.className = "empty-msg";
    msg.textContent = "Showing all " + DATA.length + " distributor locations across Hong Kong. 顯示全港 " + DATA.length + " 個經銷商據點。";
    listEl.appendChild(msg);
    return;
  }

  const info = DISTRICTS[key];
  const inDistrict = DATA.filter(function(d){ return d.d === key; });

  markers.forEach(function(m){
    m.setMap(m._district === key ? map : null);
  });

  map.setCenter({lat:info.lat, lng:info.lng});
  map.setZoom(info.zoom);

  titleEl.textContent = key + " " + info.en;
  subEl.textContent = inDistrict.length + " distributor(s) in this district. 此區共有 " + inDistrict.length + " 位經銷商。";

  if(inDistrict.length === 0){
    const msg = document.createElement("li");
    msg.className = "empty-msg";
    msg.textContent = "No distributors listed in this district. 此區暫無經銷商資料。";
    listEl.appendChild(msg);
    return;
  }

  inDistrict
    .slice()
    .sort(function(a,b){ return a.n.localeCompare(b.n, "zh-Hant"); })
    .forEach(function(d){
      const li = document.createElement("li");
      li.textContent = d.n;
      listEl.appendChild(li);
    });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
